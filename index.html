<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ali, take a break</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<div id="balloons" aria-hidden="true"></div>
<main>
  <h1>Ali, take a break</h1>
  <p>You’ve been carrying a lot. Nothing needs fixing right now. Just breathe with the glow.</p>

  <div class="orb-wrap">
    <div class="ring"></div><div class="ring"></div><div class="ring"></div>
    <div class="orb" id="orb" aria-live="polite">breathe in</div>
  </div>

  <section>
    <h2>A few things about you</h2>
    <p>Tap whenever you need a reason to smile.</p>
    <div class="card" id="card" aria-live="polite">You are so loved, Ali.</div>
    <button id="next" type="button">Another one</button>
  </section>

  <section>
    <h2>Tonight, only if you want</h2>
    <ul>
      <li><label><input type="checkbox"><span>Drink a glass of water</span></label></li>
      <li><label><input type="checkbox"><span>Put your phone down for ten minutes</span></label></li>
      <li><label><input type="checkbox"><span>Wrap up in something soft</span></label></li>
      <li><label><input type="checkbox"><span>Eat something warm</span></label></li>
      <li><label><input type="checkbox"><span>Sleep early. The to-do list will wait.</span></label></li>
    </ul>
  </section>

  <footer>
    I’m proud of you, and I’m right here.
    <small>I love you, Ali. ♥</small>
  </footer>
</main>
<script src="script.js"></script>
</body>
</html>
